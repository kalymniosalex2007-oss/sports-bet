# Render Blueprint: Node web service με μόνιμο δίσκο για τη SQLite (ο δίσκος απαιτεί πληρωμένο plan)
services:
  - type: web
    name: goalpredict
    runtime: docker
    plan: starter
    disk: { name: data, mountPath: /data, sizeGB: 1 }
    envVars:
      - { key: SITE_URL, sync: false }
      - { key: API_FOOTBALL_KEY, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: API_DELAY_MS, value: "6500" }
      - { key: MAX_ANALYSES_PER_DAY, value: "10" }
